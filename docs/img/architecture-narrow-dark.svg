0;0.78;0.785;0.92;0.925;1"/></circle></g><g class="edge" data-from="voice" data-to="router"><path d="M120,488 V520" fill="none" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a-ink2)"/><text x="128" y="510" font-size="14" font-weight="400" fill="#9da7b3" text-anchor="start">text</text><circle class="dot" r="4" fill="#9da7b3" stroke="#0d1117" stroke-width="1.5" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" path="M120,488 V520" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1;0.16;1"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1;0.105;0.16;0.165;1"/></circle></g><g class="edge" data-from="router" data-to="local"><path d="M176,557 H226" fill="none" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a-ink2)"/><text x="201" y="549" font-size="14" font-weight="400" fill="#9da7b3" text-anchor="middle">local</text><circle class="dot" r="4" fill="#9da7b3" stroke="#0d1117" stroke-width="1.5" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" path="M176,557 H226" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.16;0.22;1"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.16;0.165;0.22;0.225;1"/></circle></g><g class="edge" data-from="router" data-to="hosted"><path d="M164,522 V512 H376 V325 H370" fill="none" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a-ink2)"/><text x="368" y="503" font-size="14" font-weight="400" fill="#9da7b3" text-anchor="end">release label only</text><circle class="dot" r="4" fill="#9da7b3" stroke="#0d1117" stroke-width="1.5" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" path="M164,522 V512 H376 V325 H370" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.23;0.31;1"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.23;0.235;0.31;0.315;1"/></circle></g><g class="edge" data-from="memory" data-to="router"><path d="M100,622 V594" f