<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1104" width="400" height="1104" role="img" aria-label="How Kyra fits together. The owner talks through voice or text to a turn router that picks a local model or a hosted one behind a labelled gate with a daily spend cap. A feature request is planned into a DAG by the Board and planners, built by agent lanes, tested, and landed on master by a fast-forward gate; a keeper holds the queue when master is red. Memory gives the router and the lanes context packs and takes inbox lines back. CAD builds parts as GLB for the 3D viewer." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>How Kyra fits together. The owner talks through voice or text to a turn router that picks a local model or a hosted one behind a labelled gate with a daily spend cap. A feature request is planned into a DAG by the Board and planners, built by agent lanes, tested, and landed on master by a fast-forward gate; a keeper holds the queue when master is red. Memory gives the router and the lanes context packs and takes inbox lines back. CAD builds parts as GLB for the 3D viewer.</title><defs><marker id="a-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2459c7"/></marker><marker id="a-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a95300"/></marker></defs><rect x="0.5" y="0.5" width="399" height="1103" rx="12" fill="#ffffff" stroke="#d1d9e0"/><g class="card"><rect x="16" y="16" width="368" height="44" rx="8" fill="#f6f8fa" stroke="#c4ccd5" stroke-width="1.2"/><text x="28" y="43.5" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Owner</text><text x="96" y="42.5" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">text, voice</text></g><path d="M200,60 V106" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a-ink2)"/><text x="16" y="98" font-size="12" font-weight="600" fill="#6e7781" text-anchor="start" letter-spacing="0.08em">OWNER TALKS</text><g class="card"><rect x="16" y="108" width="368" height="60" rx="8" fill="#f6f8fa" stroke="#c4ccd5" stroke-width="1.2"/><text x="28" y="132" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Voice or text</text><text x="28" y="152" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">push to talk or VAD, local speech to text</text></g><path d="M90,168 V192" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a-ink2)"/><g class="card"><rect x="16" y="194" width="156" height="112" rx="8" fill="#f6f8fa" stroke="#c4ccd5" stroke-width="1.2"/><text x="28" y="230" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Turn router</text><text x="28" y="250" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">local or hosted,</text><text x="28" y="267" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">tool calls hosted,</text><text x="28" y="284" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">each choice logged</text></g><path d="M172,250 H182 V220 H192" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a-ink2)"/><path d="M182,250 V280 H192" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a-ink2)"/><g class="card"><rect x="194" y="194" width="190" height="52" rx="8" fill="#f6f8fa" stroke="#c4ccd5" stroke-width="1.2"/><text x="206" y="218" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Local models</text><text x="206" y="238" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">offline, never downloads</text></g><g class="card"><rect x="194" y="254" width="190" height="52" rx="8" fill="#f6f8fa" stroke="#c4ccd5" stroke-width="1.2"/><text x="206" y="278" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Hosted models</text><text x="206" y="298" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">labelled gate, daily cap</text></g><g class="card"><rect x="16" y="336" width="368" height="74" rx="8" fill="#fdf4ea" stroke="#a95300" stroke-width="1.2"/><text x="28" y="360" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Memory</text><text x="28" y="380" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">tenant-isolated stores, versioned facts,</text><text x="28" y="397" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">erasure with an audit log</text></g><path d="M90,336 V310" fill="none" stroke="#a95300" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-mem)"/><text x="98" y="327" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">context pack</text><text x="16" y="456" font-size="12" font-weight="600" fill="#6e7781" text-anchor="start" letter-spacing="0.08em">OWNER REQUESTS A FEATURE</text><path d="M316,410 V578 H294" fill="none" stroke="#a95300" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-mem)"/><text x="310" y="432" font-size="13" font-weight="400" fill="#59636e" text-anchor="end">context pack</text><path d="M292,602 H340 V412" fill="none" stroke="#a95300" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-mem)"/><text x="346" y="430" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">inbox</text><text x="346" y="446" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">lines</text><g class="card"><rect x="16" y="466" width="276" height="70" rx="8" fill="#f6f8fa" stroke="#c4ccd5" stroke-width="1.2"/><text x="28" y="490" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Plan</text><text x="28" y="510" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">Board and planners split</text><text x="28" y="527" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">the request into a DAG</text></g><g class="card"><rect x="16" y="556" width="276" height="70" rx="8" fill="#f6f8fa" stroke="#c4ccd5" stroke-width="1.2"/><text x="28" y="580" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Build</text><text x="28" y="600" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">Codex, Claude, Cursor, Grok</text><text x="28" y="617" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">and local Qwen lanes</text></g><path d="M154,536 V554" fill="none" stroke="#2459c7" stroke-width="2" marker-end="url(#a-acc)"/><g class="card"><rect x="16" y="646" width="276" height="70" rx="8" fill="#f6f8fa" stroke="#c4ccd5" stroke-width="1.2"/><text x="28" y="670" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Test</text><text x="28" y="690" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">impacted tests, privacy</text><text x="28" y="707" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">guards and ruff</text></g><path d="M154,626 V644" fill="none" stroke="#2459c7" stroke-width="2" marker-end="url(#a-acc)"/><g class="card"><rect x="16" y="736" width="276" height="70" rx="8" fill="#f6f8fa" stroke="#c4ccd5" stroke-width="1.2"/><text x="28" y="760" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Land</text><text x="28" y="780" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">reviewed sha only,</text><text x="28" y="797" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">fast-forward push</text></g><path d="M154,716 V734" fill="none" stroke="#2459c7" stroke-width="2" marker-end="url(#a-acc)"/><g class="card"><rect x="16" y="826" width="276" height="70" rx="8" fill="#eaf1fd" stroke="#2459c7" stroke-width="1.2"/><text x="28" y="850" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">master</text><text x="28" y="870" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">keeper runs the full</text><text x="28" y="887" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">suite on every new sha</text></g><path d="M154,806 V824" fill="none" stroke="#2459c7" stroke-width="2" marker-end="url(#a-acc)"/><path d="M292,861 H366 V618 H294" fill="none" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-ink2)"/><text x="300" y="832" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">red: fix</text><text x="300" y="848" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">or revert</text><text x="16" y="936" font-size="12" font-weight="600" fill="#6e7781" text-anchor="start" letter-spacing="0.08em">OWNER OPENS A MODEL</text><g class="card"><rect x="16" y="946" width="368" height="58" rx="8" fill="#f6f8fa" stroke="#c4ccd5" stroke-width="1.2"/><text x="28" y="970" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">CAD kernel</text><text x="28" y="990" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">JSON part spec, sketch solver, build123d</text></g><path d="M100,1004 V1028" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a-ink2)"/><text x="108" y="1021" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">GLB</text><g class="card"><rect x="16" y="1030" width="368" height="58" rx="8" fill="#f6f8fa" stroke="#c4ccd5" stroke-width="1.2"/><text x="28" y="1054" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">3D viewer</text><text x="28" y="1074" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">three.js; one mate solver in Python and JS</text></g></svg>
