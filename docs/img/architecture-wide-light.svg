400" fill="#59636e" text-anchor="start">inbox lines</text><circle class="dot" r="4" fill="#b0471a" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" path="M440,412 V378" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.47;0.54;1"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.47;0.475;0.54;0.545;1"/></circle></g><g class="edge" data-from="build" data-to="land"><path d="M496,460 H566" fill="none" stroke="#1f63c0" stroke-width="2" marker-end="url(#a-team)"/><text x="531" y="452" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">branch</text><circle class="dot" r="4" fill="#1f63c0" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" path="M496,460 H566" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.47;0.54;1"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.47;0.475;0.54;0.545;1"/></circle></g><g class="edge" data-from="land" data-to="landed"><path d="M728,435 H782" fill="none" stroke="#1f63c0" stroke-width="2" marker-end="url(#a-team)"/><text x="755" y="428" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">pass</text><circle class="dot" r="4" fill="#1f63c0" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" path="M728,435 H782" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.55;0.61;1"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.55;0.555;0.61;0.615;1"/></circle></g><g class="edge" data-from="land" data-to="refused"><path d="M728,487 H782" fill="none" stroke="#1f63c0" stroke-width="2" marker-end="url(#a-team)"/><text x="755" y="480" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">fail</text><circle class="dot" r="4" fill="#1f63c0" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" path="M728,487 H782" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.62;0.68;1"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.62;0.625;0.68;0.685;1"/></circle></g><g class="edge" data-from="cad" data-to="viewer"><path d="M404,580 H478" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a-ink2)"/><text x="441" y="572" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">GLB</text><circle class="dot" r="4" fill="#59636e" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" path="M404,580 H478" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.72;0.79;1"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.72;0.725;0.79;0.795;1"/></circle></g><g class="card" data-id="owner" data-group="owner"><rect x="32" y="98" width="120" height="52" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.6"/><text x="44" y="129.5" font-size="16" font-weight="700" fill="#57606a" text-anchor="start">Owner</text></g><g class="card" data-id="data" data-group="owner"><rect x="172" y="98" width="200" height="52" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.6"/><text x="184" y="122" font-size="16" font-weight="700" fill="#57606a" text-anchor="start">Personal data</text><text x="184" y="143" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">not in this repo</text></g><g class="card" data-id="private" data-group="owner"><rect x="392" y="98" width="208" height="52" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.6"/><text x="404" y="122" font-size="16" font-weight="700" fill="#57606a" text-anchor="start">Private code</text><text x="404" y="143" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">not in this repo</text></g><g class="card" data-id="hosted" data-group="talk"><rect x="648" y="98" width="280" height="52" rx="8" fill="