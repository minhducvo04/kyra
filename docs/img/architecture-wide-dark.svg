<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="How Kyra fits together. The owner talks through voice or text to a turn router that picks a local model or a hosted one behind a labelled gate with a daily spend cap. A feature request is planned into a DAG by the Board and planners, built by agent lanes, tested, and landed on master by a fast-forward gate; a keeper holds the queue when master is red. Memory gives the router and the lanes context packs and takes inbox lines back. CAD builds parts as GLB for the 3D viewer." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>How Kyra fits together. The owner talks through voice or text to a turn router that picks a local model or a hosted one behind a labelled gate with a daily spend cap. A feature request is planned into a DAG by the Board and planners, built by agent lanes, tested, and landed on master by a fast-forward gate; a keeper holds the queue when master is red. Memory gives the router and the lanes context packs and takes inbox lines back. CAD builds parts as GLB for the 3D viewer.</title><defs><marker id="a-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9da7b3"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#79a6ff"/></marker><marker id="a-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0a35e"/></marker></defs><rect x="0.5" y="0.5" width="959" height="599" rx="12" fill="#0d1117" stroke="#30363d"/><g class="card"><rect x="24" y="316" width="100" height="64" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="36" y="340" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">Owner</text><text x="36" y="360" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">text, voice</text></g><path d="M124,348 H140" fill="none" stroke="#9da7b3" stroke-width="1.5"/><path d="M140,100 V574" fill="none" stroke="#9da7b3" stroke-width="1.5"/><path d="M140,100 H162" fill="none" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a-ink2)"/><path d="M140,348 H162" fill="none" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a-ink2)"/><path d="M140,574 H756 V558" fill="none" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a-ink2)"/><text x="164" y="46" font-size="12" font-weight="600" fill="#8b949e" text-anchor="start" letter-spacing="0.08em">OWNER TALKS</text><g class="card"><rect x="164" y="56" width="176" height="88" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="176" y="80" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Voice or text</text><text x="176" y="100" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">push to talk or VAD,</text><text x="176" y="117" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">local speech to text</text></g><path d="M340,100 H374" fill="none" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a-ink2)"/><g class="card"><rect x="376" y="56" width="190" height="88" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="388" y="80" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Turn router</text><text x="388" y="100" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">local or hosted,</text><text x="388" y="117" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">tool calls hosted,</text><text x="388" y="134" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">each choice logged</text></g><path d="M566,100 H584 V76 H604" fill="none" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a-ink2)"/><path d="M584,100 V124 H604" fill="none" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a-ink2)"/><g class="card"><rect x="606" y="56" width="330" height="40" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="618" y="81.5" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Local models</text><text x="728" y="80.5" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">offline, never downloads</text></g><g class="card"><rect x="606" y="104" width="330" height="40" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="618" y="129.5" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Hosted models</text><text x="728" y="128.5" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">labelled gate, daily cap</text></g><g class="card"><rect x="164" y="180" width="772" height="48" rx="8" fill="#2a1c0f" stroke="#f0a35e" stroke-width="1.2"/><text x="176" y="209.5" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Memory</text><text x="250" y="208.5" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">tenant-isolated stores, versioned facts, erasure with an audit log</text></g><path d="M471,180 V148" fill="none" stroke="#f0a35e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-mem)"/><text x="479" y="168" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">context pack</text><text x="164" y="290" font-size="12" font-weight="600" fill="#8b949e" text-anchor="start" letter-spacing="0.08em">OWNER REQUESTS A FEATURE</text><g class="card"><rect x="164.0" y="300" width="138" height="96" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="176.0" y="324" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">Plan</text><text x="176.0" y="344" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">Board, planners</text><text x="176.0" y="361" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">split it into a</text><text x="176.0" y="378" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">feature DAG</text></g><g class="card"><rect x="322.5" y="300" width="138" height="96" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="334.5" y="324" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">Build</text><text x="334.5" y="344" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">Codex, Claude,</text><text x="334.5" y="361" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">Cursor, Grok and</text><text x="334.5" y="378" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">local Qwen lanes</text></g><path d="M302.0,348 H320.5" fill="none" stroke="#79a6ff" stroke-width="2" marker-end="url(#a-acc)"/><g class="card"><rect x="481.0" y="300" width="138" height="96" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="493.0" y="324" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">Test</text><text x="493.0" y="344" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">impacted tests,</text><text x="493.0" y="361" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">privacy guards</text><text x="493.0" y="378" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">and ruff</text></g><path d="M460.5,348 H479.0" fill="none" stroke="#79a6ff" stroke-width="2" marker-end="url(#a-acc)"/><g class="card"><rect x="639.5" y="300" width="138" height="96" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="651.5" y="324" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">Land</text><text x="651.5" y="344" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">reviewed sha only,</text><text x="651.5" y="361" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">fast-forward</text><text x="651.5" y="378" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">push</text></g><path d="M619.0,348 H637.5" fill="none" stroke="#79a6ff" stroke-width="2" marker-end="url(#a-acc)"/><g class="card"><rect x="798.0" y="300" width="138" height="96" rx="8" fill="#132541" stroke="#79a6ff" stroke-width="1.2"/><text x="810.0" y="324" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">master</text><text x="810.0" y="344" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">keeper runs the</text><text x="810.0" y="361" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">full suite on</text><text x="810.0" y="378" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">every new sha</text></g><path d="M777.5,348 H796.0" fill="none" stroke="#79a6ff" stroke-width="2" marker-end="url(#a-acc)"/><path d="M395.5,228 V298" fill="none" stroke="#f0a35e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-mem)"/><text x="389.5" y="251" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="end">context pack</text><path d="M427.5,300 V230" fill="none" stroke="#f0a35e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-mem)"/><text x="433.5" y="251" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">inbox lines</text><path d="M867.0,396 V424 H391.5 V398" fill="none" stroke="#9da7b3" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-ink2)"/><text x="629.25" y="443" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="middle">red master: the keeper holds the queue, sends a fix or a revert</text><text x="164" y="486" font-size="12" font-weight="600" fill="#8b949e" text-anchor="start" letter-spacing="0.08em">OWNER OPENS A MODEL</text><g class="card"><rect x="164" y="496" width="340" height="60" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="176" y="520" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">CAD kernel</text><text x="176" y="540" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">JSON part spec, sketch solver, build123d</text></g><g class="card"><rect x="576" y="496" width="360" height="60" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/><text x="588" y="520" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">3D viewer</text><text x="588" y="540" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start">three.js; one mate solver in Python and JS</text></g><path d="M504,526 H574" fill="none" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a-ink2)"/><text x="540" y="518" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="middle">GLB</text></svg>
