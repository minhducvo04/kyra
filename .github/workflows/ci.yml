name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kyra
          POSTGRES_PASSWORD: kyra
          POSTGRES_DB: kyra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kyra" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The runtime requirements pull in torch/mlx/faster-whisper (GBs);
      # CI only needs what the unit tests import. Keep this list in step
      # with what tests/ actually touches.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic python-dotenv fastapi uvicorn python-multipart pypdf python-docx pydantic pydantic-settings \
                      sqlalchemy alembic 'psycopg[binary]' chromadb pytest httpx ruff
      - name: Lint
        run: ruff check src scripts tests
      - name: Unit tests (LaTeX-dependent tests skip when no engine is installed)
        env:
          ANTHROPIC_API_KEY: ci-placeholder-not-a-real-key
          TEST_DATABASE_URL: postgresql+psycopg://kyra:kyra@localhost:5432/kyra_test
        run: pytest

  docker:
    # Docker isn't installed on the dev Mac; CI is where the image is actually built.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kyra-api:ci .
      - name: Container serves the API, and the gate holds with a token set
        run: |
          docker run -d --name kyra -e ANTHROPIC_API_KEY=ci-placeholder \
            -e KYRA_API_TOKEN=ci-smoke-token -p 8420:8420 kyra-api:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8420/healthz && break; sleep 2; done
          # Health must answer unauthenticated, or the deploy restart-loops.
          curl -sf http://127.0.0.1:8420/healthz | grep -q '"ok"'
          # ...and the API must not, or the host is open to the internet.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8420/api/backend)" = 401
          curl -sf -H 'Authorization: Bearer ci-smoke-token' http://127.0.0.1:8420/api/backend | grep -q '"backend"'
          docker logs kyra | tail -20

  terraform:
    # Terraform isn't installed on the dev Mac either; this is the real syntax/schema check for deploy/aws.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format check
        run: terraform -chdir=deploy/aws fmt -check -diff -recursive
      - name: Validate (no backend, no credentials)
        run: |
          terraform -chdir=deploy/aws init -backend=false -input=false
          terraform -chdir=deploy/aws validate

  deploy:
    # Skipped until the repository variables AWS_ROLE_ARN and AWS_REGION exist (deploy/aws/README.md step 4).
    # Authenticates with a short-lived OIDC token via the role Terraform created - no AWS keys in GitHub.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.AWS_ROLE_ARN != ''
    needs: [test, docker, terraform]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push the image (:latest and :<sha>)
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/kyra
        run: |
          docker build -t "$REPO:latest" -t "$REPO:${GITHUB_SHA}" .
          docker push "$REPO:latest"
          docker push "$REPO:${GITHUB_SHA}"
      - name: Roll both services onto the new image
        run: |
          aws ecs update-service --cluster kyra --service kyra-api --force-new-deployment --no-cli-pager
          aws ecs update-service --cluster kyra --service kyra-worker --force-new-deployment --no-cli-pager
