name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The runtime requirements pull in torch/mlx/faster-whisper (GBs);
      # CI only needs what the unit tests import. Keep this list in step
      # with what tests/ actually touches.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic python-dotenv fastapi uvicorn python-multipart pypdf python-docx pydantic \
                      pytest httpx ruff
      - name: Lint
        run: ruff check src scripts tests
      - name: Unit tests (LaTeX-dependent tests skip when no engine is installed)
        env:
          ANTHROPIC_API_KEY: ci-placeholder-not-a-real-key
        run: pytest
