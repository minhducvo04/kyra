name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kyra
          POSTGRES_PASSWORD: kyra
          POSTGRES_DB: kyra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kyra" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The runtime requirements pull in torch/mlx/faster-whisper (GBs);
      # CI only needs what the unit tests import. Keep this list in step
      # with what tests/ actually touches.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic python-dotenv fastapi uvicorn python-multipart pypdf python-docx pydantic pydantic-settings \
                      sqlalchemy alembic 'psycopg[binary]' pytest httpx ruff
      - name: Lint
        run: ruff check src scripts tests
      - name: Unit tests (LaTeX-dependent tests skip when no engine is installed)
        env:
          ANTHROPIC_API_KEY: ci-placeholder-not-a-real-key
          TEST_DATABASE_URL: postgresql+psycopg://kyra:kyra@localhost:5432/kyra_test
        run: pytest

  docker:
    # Docker isn't installed on the dev Mac; CI is where the image is actually built.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kyra-api:ci .
      - name: Container serves the API (no API key needed for /api/backend)
        run: |
          docker run -d --name kyra -e ANTHROPIC_API_KEY=ci-placeholder -p 8420:8420 kyra-api:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8420/api/backend && break; sleep 2; done
          curl -sf http://127.0.0.1:8420/api/backend | grep -q '"backend"'
          docker logs kyra | tail -20
