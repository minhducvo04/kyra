[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "kyra-system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pydantic-settings>=2", "sqlalchemy>=2", "numpy>=1.24", "httpx>=0.27", "anthropic>=0.40", "fastapi>=0.115", "python-multipart>=0.0.9", "PyYAML>=6", "huggingface_hub>=0.23"]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3"]
cad = ["build123d>=0.10", "scipy>=1.11"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# Portability contract: no marker = hermetic, runs anywhere. Descriptions mirror
# companion.test_markers.MARKERS; tests/test_test_markers.py keeps them in sync.
markers = [
    "needs_macos: needs a macOS-only tool or API (sandbox-exec, plutil, launchd)",
    "needs_real_data: reads the repo's real data/ (owner Mac only)",
    "needs_git_history: needs more git history than a one-commit archive",
    "needs_network_loopback: binds or calls 127.0.0.1 / localhost",
    "needs_gpu: needs GPU VRAM",
    "timing_sensitive: asserts on wall-clock timing; place on a low-load runner",
]

[tool.setuptools.package-data]
"companion.cad" = ["worked_examples.json"]
"companion" = ["model3d_library/*.json"]
"kyra_memory" = ["pg_schema.sql"]
