[project]
name = "companion"
version = "0.1.0"
description = "A personal AI companion: persona, long-term memory (RAG), agentic tools, voice, and animation."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
    "numpy>=1.24.0",
    "faster-whisper>=1.0.0",
    "kokoro-onnx>=0.6.0",
    "silero-vad>=6.0.0",
    "sounddevice>=0.5.0",
    "torch>=2.0.0",
    "mlx-lm>=0.31.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "ebooklib>=0.18",
    "sentence-transformers>=3.0.0",
    "playwright>=1.47.0",
    "python-docx>=1.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "scripts", "tests"]
exclude = ["scratchpad", "data", ".venv"]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors, I: import order, B: bugbear (real
# bug patterns - mutable defaults, unused loop vars), UP: modern syntax.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length is a formatting concern; long prompt strings are deliberate
    "B008",  # FastAPI's `File(None)` / `Form(...)` in defaults is the framework's own idiom
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # scripts sys.path.insert(src) before importing companion - deliberate, see CLAUDE.md

[tool.ruff.lint.isort]
known-first-party = ["companion"]
