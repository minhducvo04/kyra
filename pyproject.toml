[project]
name = "companion"
version = "0.1.0"
description = "A personal AI companion: persona, long-term memory (RAG), agentic tools, voice, and animation."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
    "numpy>=1.24.0",
    "faster-whisper>=1.0.0",
    "kokoro-onnx>=0.6.0",
    "silero-vad>=6.0.0",
    "sounddevice>=0.5.0",
    "torch>=2.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
